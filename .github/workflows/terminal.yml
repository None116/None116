name: Update Terminal SVG

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate terminal SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          import html

          def esc(s):
              return html.escape(s)

          lines = [
              "semoof@arch ~ % fastfetch",
              "OS: Arch Linux x86_64",
              "Kernel: caffeine-powered",
              "Shell: zsh",
              "Editor: VS Code / Vim when brave",
              "Stack: JavaScript, React, Workers, APIs",
              "Uptime: building quietly",
              "",
              "$ pwd",
              "/home/semoof/projects",
              "",
              "$ ls -la",
              "drwxr-xr-x  MRPSite/",
              "drwxr-xr-x  ai-moderation-worker/",
              "drwxr-xr-x  window-translator/",
              "drwxr-xr-x  serverless-tools/",
              "",
              "$ git status",
              "On branch main",
              "working tree clean",
              "",
              "$ git log --oneline -5",
              "a91c0de update project showcase",
              "b16f00d improve worker fallback",
              "c0ffee fix UI spacing",
              "badc0de remove cringe",
              "1337abc ship quiet build",
              "",
              "$ npm install",
              "packages checked",
              "dependencies ready",
              "",
              "$ npm run dev",
              "local server started",
              "listening on localhost:5173",
              "",
              "$ curl /api/health",
              '{ \"status\": \"ok\", \"runtime\": \"worker\", \"cache\": \"warm\" }',
              "",
              "$ node worker.js --dry-run",
              "loading moderation pipeline",
              "local filter ready",
              "cloudflare ai ready",
              "groq fallback ready",
              "decision: allow",
              "",
              "$ grep -R \"TODO\" src/",
              "src/ui/polish.js: TODO: make it cleaner",
              "src/api/fallback.js: TODO: handle timeout",
              "",
              "$ vim src/api/fallback.js",
              ":wq",
              "patched timeout handler",
              "",
              "$ npm run lint",
              "0 errors found",
              "",
              "$ npm run test",
              "moderation.test.js passed",
              "api-fallback.test.js passed",
              "ui-spacing.test.js passed",
              "",
              "$ npm run build",
              "bundling assets",
              "optimizing chunks",
              "minifying modules",
              "build complete",
              "",
              "$ du -sh dist",
              "428K dist",
              "",
              "$ wrangler deploy",
              "uploading worker",
              "checking routes",
              "publishing version",
              "deployment successful",
              "",
              "$ curl /api/moderate -X POST",
              '{ \"safe\": true, \"source\": \"local+fallback\" }',
              "",
              "$ git diff --stat",
              "README.md                  | 42 +++++++++++++",
              "assets/showcase.svg        | 91 +++++++++++++++++++++++++",
              "worker.js                  | 18 ++++++",
              "",
              "$ git add .",
              "staged changes",
              "",
              '$ git commit -m \"clean profile update\"',
              "3 files changed",
              "commit created",
              "",
              "$ git push",
              "enumerating objects",
              "compressing objects",
              "writing objects",
              "private repos updated",
              "public grind visible",
              "",
              "$ sudo pacman -Syu",
              ":: synchronizing package databases...",
              ":: system is already up to date",
              "",
              "$ echo \"never push secrets\"",
              "never push secrets",
              "",
              "$ cat .gitignore",
              ".env",
              ".env.local",
              "node_modules/",
              "dist/",
              "",
              "$ rm -rf cringe",
              "removed: cringe/",
              "",
              "$ echo done",
              "done █",
          ]

          tspans = []
          delay = 0.0

          for i, line in enumerate(lines):
              if line.startswith("$") or line.startswith("semoof@arch"):
                  cls = "cmd"
              elif line == "":
                  cls = "out"
              elif "passed" in line or "successful" in line or "ready" in line or "clean" in line:
                  cls = "ok"
              elif "TODO" in line:
                  cls = "warn"
              else:
                  cls = "out"

              dy = 0 if i == 0 else 22
              text = " " if line == "" else esc(line)

              tspans.append(
                  f'<tspan class="line {cls}" style="animation-delay:{delay:.2f}s" x="34" dy="{dy}">{text}</tspan>'
              )
              delay += 0.10

          svg = f'''<svg width="940" height="1880" viewBox="0 0 940 1880" xmlns="http://www.w3.org/2000/svg">
            <style>
              text {{
                font-family: JetBrains Mono, Fira Code, Consolas, monospace;
                font-size: 15px;
              }}
              .bg {{ fill: #050505; }}
              .top {{ fill: #101010; }}
              .border {{ fill: none; stroke: #2A2A2A; stroke-width: 1.5; }}
              .title {{ fill: #9A9A9A; font-size: 14px; }}
              .cmd {{ fill: #FFFFFF; font-weight: 700; }}
              .out {{ fill: #BDBDBD; }}
              .ok {{ fill: #EDEDED; }}
              .warn {{ fill: #DADADA; font-weight: 700; }}
              .line {{ opacity: 0; animation: show 0.10s forwards; }}
              .cursor {{ animation: blink 1s step-end infinite; }}
              @keyframes show {{ to {{ opacity: 1; }} }}
              @keyframes blink {{ 50% {{ opacity: 0; }} }}
            </style>

            <rect class="bg" width="940" height="1880" rx="22"/>
            <rect class="border" x="1" y="1" width="938" height="1878" rx="21"/>

            <rect class="top" x="0" y="0" width="940" height="42" rx="22"/>
            <circle cx="24" cy="21" r="6" fill="#555"/>
            <circle cx="46" cy="21" r="6" fill="#777"/>
            <circle cx="68" cy="21" r="6" fill="#999"/>
            <text x="92" y="27" class="title">semoof@arch: ~/projects</text>

            <text x="34" y="76">
              {''.join(tspans)}
            </text>
          </svg>'''

          svg = svg.replace("done █", 'done <tspan class="cursor">█</tspan>')

          with open("assets/terminal.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit and push terminal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/terminal.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update terminal SVG"
          git pull --rebase origin main || true
          git push origin main
