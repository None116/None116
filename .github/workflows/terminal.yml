name: Update Arch Terminal SVG

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate terminal SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          import html

          def esc(s):
              return html.escape(s)

          lines = [
              "semoof@arch ~ % neofetch",
              "        /\\        OS: Arch Linux x86_64",
              "       /  \\       User: Semoof / None116",
              "      / /\\ \\      Shell: zsh",
              "     / ____ \\     Stack: JavaScript, React, Workers, APIs",
              "    /_/    \\_\\    Mode: private repos, public grind",
              "",
              "$ pwd",
              "/home/semoof/projects",
              "",
              "$ ls",
              "MRPSite/  ai-moderation-worker/  translator/  tools/",
              "",
              "$ git status",
              "On branch main",
              "working tree clean",
              "",
              "$ npm install",
              "packages checked",
              "dependencies ready",
              "",
              "$ npm run dev",
              "local server started",
              "listening on localhost:5173",
              "",
              "$ curl /api/health",
              '{ "status": "ok", "runtime": "worker", "cache": "warm" }',
              "",
              "$ node worker.js --dry-run",
              "loading moderation pipeline",
              "local filter ready",
              "api fallback ready",
              "",
              "$ npm run lint",
              "0 errors found",
              "",
              "$ npm run build",
              "bundling assets",
              "optimizing chunks",
              "build complete",
              "",
              "$ wrangler deploy",
              "uploading worker",
              "routes checked",
              "deployment successful",
              "",
              "$ git add .",
              "staged changes",
              "",
              '$ git commit -m "ship clean update"',
              "7 files changed",
              "commit created",
              "",
              "$ git push",
              "enumerating objects",
              "compressing objects",
              "private repos updated",
              "public grind visible",
              "",
              "$ echo done",
              "done █",
          ]

          tspans = []
          delay = 0.0

          for i, line in enumerate(lines):
              cls = "cmd" if line.startswith("$") or line.startswith("semoof@arch") else "out"
              dy = 0 if i == 0 else 22
              tspans.append(
                  f'<tspan class="line {cls}" style="animation-delay:{delay:.1f}s" x="34" dy="{dy}">{esc(line)}</tspan>'
              )
              delay += 0.12

          svg = f'''<svg width="940" height="1420" viewBox="0 0 940 1420" xmlns="http://www.w3.org/2000/svg">
            <style>
              text {{
                font-family: JetBrains Mono, Fira Code, Consolas, monospace;
                font-size: 15px;
              }}
              .bg {{ fill: #050505; }}
              .top {{ fill: #101010; }}
              .border {{ fill: none; stroke: #2A2A2A; stroke-width: 1.5; }}
              .title {{ fill: #9A9A9A; font-size: 14px; }}
              .cmd {{ fill: #FFFFFF; font-weight: 700; }}
              .out {{ fill: #BDBDBD; }}
              .line {{ opacity: 0; animation: show 0.12s forwards; }}
              .cursor {{ animation: blink 1s step-end infinite; }}
              @keyframes show {{ to {{ opacity: 1; }} }}
              @keyframes blink {{ 50% {{ opacity: 0; }} }}
            </style>

            <rect class="bg" width="940" height="1420" rx="22"/>
            <rect class="border" x="1" y="1" width="938" height="1418" rx="21"/>

            <rect class="top" x="0" y="0" width="940" height="42" rx="22"/>
            <circle cx="24" cy="21" r="6" fill="#555"/>
            <circle cx="46" cy="21" r="6" fill="#777"/>
            <circle cx="68" cy="21" r="6" fill="#999"/>
            <text x="92" y="27" class="title">semoof@arch: ~/projects</text>

            <text x="34" y="76">
              {''.join(tspans)}
            </text>
          </svg>'''

          svg = svg.replace("done █", 'done <tspan class="cursor">█</tspan>')

          with open("assets/terminal.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit and push terminal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/terminal.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Arch terminal SVG"
          git pull --rebase origin main || true
          git push origin main
