name: Update Arch Terminal SVG
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate terminal SVG
        run: |
          mkdir -p assets

          cat > assets/terminal.svg <<'EOF'
<svg width="940" height="920" viewBox="0 0 940 920" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #050505; }
    .top { fill: #101010; }
    .border { fill: none; stroke: #2A2A2A; stroke-width: 1.5; }
    text {
      font-family: JetBrains Mono, Fira Code, Consolas, monospace;
      font-size: 14px;
      fill: #EDEDED;
    }
    .muted { fill: #9A9A9A; }
    .ok { fill: #BDBDBD; }
    .cmd { fill: #FFFFFF; font-weight: 700; }
    .arch { fill: #FFFFFF; font-weight: 700; }
    .line { opacity: 0; animation: show 0.15s forwards; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect class="bg" width="940" height="920" rx="22"/>
  <rect class="border" x="1" y="1" width="938" height="918" rx="21"/>

  <rect class="top" x="0" y="0" width="940" height="42" rx="22"/>
  <circle cx="24" cy="21" r="6" fill="#555"/>
  <circle cx="46" cy="21" r="6" fill="#777"/>
  <circle cx="68" cy="21" r="6" fill="#999"/>
  <text x="92" y="27" class="muted">semoof@arch: ~/projects</text>

  <text x="34" y="76" class="arch">
    <tspan class="line" style="animation-delay:0.0s" x="34" dy="0">                   -`</tspan>
    <tspan class="line" style="animation-delay:0.1s" x="34" dy="20">                  .o+`</tspan>
    <tspan class="line" style="animation-delay:0.2s" x="34" dy="20">                 `ooo/</tspan>
    <tspan class="line" style="animation-delay:0.3s" x="34" dy="20">                `+oooo:</tspan>
    <tspan class="line" style="animation-delay:0.4s" x="34" dy="20">               `+oooooo:</tspan>
    <tspan class="line" style="animation-delay:0.5s" x="34" dy="20">               -+oooooo+:</tspan>
    <tspan class="line" style="animation-delay:0.6s" x="34" dy="20">             `/:-:++oooo+:</tspan>
    <tspan class="line" style="animation-delay:0.7s" x="34" dy="20">            `/++++/+++++++:</tspan>
    <tspan class="line" style="animation-delay:0.8s" x="34" dy="20">           `/++++++++++++++:</tspan>
    <tspan class="line" style="animation-delay:0.9s" x="34" dy="20">          `/+++ooooooooooooo/`</tspan>
    <tspan class="line" style="animation-delay:1.0s" x="34" dy="20">         ./ooosssso++osssssso+`</tspan>
    <tspan class="line" style="animation-delay:1.1s" x="34" dy="20">        .oossssso-````/ossssss+`</tspan>
    <tspan class="line" style="animation-delay:1.2s" x="34" dy="20">       -osssssso.      :ssssssso.</tspan>
    <tspan class="line" style="animation-delay:1.3s" x="34" dy="20">      :osssssss/        osssso+++.</tspan>
    <tspan class="line" style="animation-delay:1.4s" x="34" dy="20">     /ossssssss/        +ssssooo/-</tspan>
    <tspan class="line" style="animation-delay:1.5s" x="34" dy="20">   `/ossssso+/:-        -:/+osssso+-</tspan>
    <tspan class="line" style="animation-delay:1.6s" x="34" dy="20">  `+sso+:-`                 `.-/+oso:</tspan>
    <tspan class="line" style="animation-delay:1.7s" x="34" dy="20"> `++:.                           `-/+/</tspan>
    <tspan class="line" style="animation-delay:1.8s" x="34" dy="20"> .`                                 `/</tspan>
  </text>

  <text x="390" y="84">
    <tspan class="line cmd" style="animation-delay:2.0s" x="390" dy="0">$ neofetch --profile</tspan>
    <tspan class="line ok" style="animation-delay:2.2s" x="390" dy="22">OS: Arch Linux x86_64</tspan>
    <tspan class="line ok" style="animation-delay:2.4s" x="390" dy="22">Host: GitHub Profile README</tspan>
    <tspan class="line ok" style="animation-delay:2.6s" x="390" dy="22">User: Semoof / None116</tspan>
    <tspan class="line ok" style="animation-delay:2.8s" x="390" dy="22">Shell: zsh</tspan>
    <tspan class="line ok" style="animation-delay:3.0s" x="390" dy="22">Stack: JS, React, Workers, APIs</tspan>
    <tspan class="line ok" style="animation-delay:3.2s" x="390" dy="22">Mode: private repos, public grind</tspan>

    <tspan class="line cmd" style="animation-delay:3.5s" x="390" dy="34">$ pwd</tspan>
    <tspan class="line ok" style="animation-delay:3.7s" x="390" dy="22">/home/semoof/projects</tspan>

    <tspan class="line cmd" style="animation-delay:4.0s" x="390" dy="34">$ ls</tspan>
    <tspan class="line ok" style="animation-delay:4.2s" x="390" dy="22">MRPSite/  ai-moderation-worker/  translator/  tools/</tspan>

    <tspan class="line cmd" style="animation-delay:4.5s" x="390" dy="34">$ git status</tspan>
    <tspan class="line ok" style="animation-delay:4.7s" x="390" dy="22">On branch main</tspan>
    <tspan class="line ok" style="animation-delay:4.9s" x="390" dy="22">working tree clean</tspan>
  </text>

  <text x="34" y="490">
    <tspan class="line cmd" style="animation-delay:5.2s" x="34" dy="0">$ npm install</tspan>
    <tspan class="line ok" style="animation-delay:5.4s" x="34" dy="22">packages checked</tspan>
    <tspan class="line ok" style="animation-delay:5.6s" x="34" dy="22">dependencies ready</tspan>

    <tspan class="line cmd" style="animation-delay:5.9s" x="34" dy="32">$ npm run dev</tspan>
    <tspan class="line ok" style="animation-delay:6.1s" x="34" dy="22">local server started</tspan>
    <tspan class="line ok" style="animation-delay:6.3s" x="34" dy="22">listening on localhost:5173</tspan>

    <tspan class="line cmd" style="animation-delay:6.6s" x="34" dy="32">$ curl /api/health</tspan>
    <tspan class="line ok" style="animation-delay:6.8s" x="34" dy="22">{ "status": "ok", "runtime": "worker", "cache": "warm" }</tspan>

    <tspan class="line cmd" style="animation-delay:7.1s" x="34" dy="32">$ node worker.js --dry-run</tspan>
    <tspan class="line ok" style="animation-delay:7.3s" x="34" dy="22">loading moderation pipeline</tspan>
    <tspan class="line ok" style="animation-delay:7.5s" x="34" dy="22">local filter ready</tspan>
    <tspan class="line ok" style="animation-delay:7.7s" x="34" dy="22">api fallback ready</tspan>

    <tspan class="line cmd" style="animation-delay:8.0s" x="34" dy="32">$ npm run lint</tspan>
    <tspan class="line ok" style="animation-delay:8.2s" x="34" dy="22">0 errors found</tspan>

    <tspan class="line cmd" style="animation-delay:8.5s" x="34" dy="32">$ npm run build</tspan>
    <tspan class="line ok" style="animation-delay:8.7s" x="34" dy="22">bundling assets</tspan>
    <tspan class="line ok" style="animation-delay:8.9s" x="34" dy="22">optimizing chunks</tspan>
    <tspan class="line ok" style="animation-delay:9.1s" x="34" dy="22">build complete</tspan>
  </text>

  <text x="500" y="490">
    <tspan class="line cmd" style="animation-delay:9.4s" x="500" dy="0">$ wrangler deploy</tspan>
    <tspan class="line ok" style="animation-delay:9.6s" x="500" dy="22">uploading worker</tspan>
    <tspan class="line ok" style="animation-delay:9.8s" x="500" dy="22">routes checked</tspan>
    <tspan class="line ok" style="animation-delay:10.0s" x="500" dy="22">deployment successful</tspan>

    <tspan class="line cmd" style="animation-delay:10.3s" x="500" dy="32">$ git add .</tspan>
    <tspan class="line ok" style="animation-delay:10.5s" x="500" dy="22">staged changes</tspan>

    <tspan class="line cmd" style="animation-delay:10.8s" x="500" dy="32">$ git commit -m "ship clean update"</tspan>
    <tspan class="line ok" style="animation-delay:11.0s" x="500" dy="22">7 files changed</tspan>
    <tspan class="line ok" style="animation-delay:11.2s" x="500" dy="22">commit created</tspan>

    <tspan class="line cmd" style="animation-delay:11.5s" x="500" dy="32">$ git push</tspan>
    <tspan class="line ok" style="animation-delay:11.7s" x="500" dy="22">enumerating objects</tspan>
    <tspan class="line ok" style="animation-delay:11.9s" x="500" dy="22">compressing objects</tspan>
    <tspan class="line ok" style="animation-delay:12.1s" x="500" dy="22">private repos updated</tspan>
    <tspan class="line ok" style="animation-delay:12.3s" x="500" dy="22">public grind visible</tspan>

    <tspan class="line cmd" style="animation-delay:12.6s" x="500" dy="32">$ echo done</tspan>
    <tspan class="line ok" style="animation-delay:12.8s" x="500" dy="22">done <tspan class="cursor">█</tspan></tspan>
  </text>
</svg>
EOF

      - name: Commit and push terminal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/terminal.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Arch terminal SVG"
          git pull --rebase origin main || true
          git push origin main
