name: Update Project Showcase Card

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate showcase SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import html

          now = datetime.now(ZoneInfo("Europe/Helsinki")).strftime("%d.%m.%Y • %H:%M")

          projects = [
              {
                  "title": "MRPSite",
                  "desc": "Clean web interface with polished layouts and UI logic.",
                  "visibility": "PRIVATE",
                  "status": "ACTIVE",
                  "icon": "monitor",
                  "tags": ["React", "JavaScript", "UI"]
              },
              {
                  "title": "AI Moderation Worker",
                  "desc": "Serverless moderation flow with filters and API fallback.",
                  "visibility": "PRIVATE",
                  "status": "ACTIVE",
                  "icon": "shield",
                  "tags": ["Workers", "API", "AI"]
              },
              {
                  "title": "Window Translator",
                  "desc": "Translation utility focused on smooth user experience.",
                  "visibility": "PRIVATE",
                  "status": "EXPERIMENT",
                  "icon": "translate",
                  "tags": ["JavaScript", "Tools", "UX"]
              },
              {
                  "title": "Serverless Tools",
                  "desc": "Small useful systems, automations and API experiments.",
                  "visibility": "PRIVATE",
                  "status": "BUILDING",
                  "icon": "server",
                  "tags": ["Workers", "Automation", "APIs"]
              }
          ]

          WIDTH = 940
          HEIGHT = 600

          def esc(text):
              return html.escape(text)

          def wrap_text(text, max_chars=42, max_lines=2):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  candidate = word if not current else current + " " + word
                  if len(candidate) <= max_chars:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              if len(lines) > max_lines:
                  lines = lines[:max_lines]
                  lines[-1] = lines[-1][:max_chars - 3].rstrip() + "..."

              return lines

          def text_lines(x, y, lines, size=14, color="#B8B8B8", line_height=22):
              out = f'''
              <text x="{x}" y="{y}" fill="{color}"
                    font-family="Inter, Segoe UI, Arial, sans-serif"
                    font-size="{size}" font-weight="400">
              '''
              for i, line in enumerate(lines):
                  dy = 0 if i == 0 else line_height
                  out += f'<tspan x="{x}" dy="{dy}">{esc(line)}</tspan>'
              out += '</text>'
              return out

          def icon(kind, x, y, size=16, color="#EDEDED"):
              common = f'x="{x}" y="{y}" width="{size}" height="{size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"'
              stroke = f'stroke="{color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'

              icons = {
                  "monitor": f'''
                  <svg {common}>
                    <rect x="3" y="4" width="18" height="12" rx="2" {stroke}/>
                    <path d="M8 20h8" {stroke}/>
                    <path d="M12 16v4" {stroke}/>
                  </svg>
                  ''',

                  "shield": f'''
                  <svg {common}>
                    <path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-3z" {stroke}/>
                    <path d="M9 12l2 2 4-5" {stroke}/>
                  </svg>
                  ''',

                  "translate": f'''
                  <svg {common}>
                    <path d="M4 5h8" {stroke}/>
                    <path d="M8 5v12" {stroke}/>
                    <path d="M12 5c-.8 4.5-3 8-7 11" {stroke}/>
                    <path d="M14 19l3-8 3 8" {stroke}/>
                    <path d="M15.2 16h3.6" {stroke}/>
                  </svg>
                  ''',

                  "server": f'''
                  <svg {common}>
                    <rect x="4" y="4" width="16" height="6" rx="2" {stroke}/>
                    <rect x="4" y="14" width="16" height="6" rx="2" {stroke}/>
                    <path d="M8 7h.01" {stroke}/>
                    <path d="M8 17h.01" {stroke}/>
                  </svg>
                  ''',

                  "react": f'''
                  <svg {common}>
                    <ellipse cx="12" cy="12" rx="9" ry="4" {stroke}/>
                    <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)" {stroke}/>
                    <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)" {stroke}/>
                    <circle cx="12" cy="12" r="2" fill="{color}"/>
                  </svg>
                  ''',

                  "javascript": f'''
                  <svg {common}>
                    <rect x="4" y="4" width="16" height="16" rx="2" {stroke}/>
                    <path d="M8 9v5.5c0 1.2-.7 2-2 2.2" {stroke}/>
                    <path d="M13 16c.5.6 1.2.9 2.1.9 1.1 0 1.9-.5 1.9-1.4 0-.8-.5-1.2-1.7-1.6l-.8-.2c-1.2-.4-1.8-1.1-1.8-2.2 0-1.3 1.1-2.2 2.5-2.2.9 0 1.7.3 2.3 1" {stroke}/>
                  </svg>
                  ''',

                  "ui": f'''
                  <svg {common}>
                    <rect x="4" y="5" width="16" height="14" rx="2" {stroke}/>
                    <path d="M4 9h16" {stroke}/>
                    <path d="M9 9v10" {stroke}/>
                  </svg>
                  ''',

                  "cloud": f'''
                  <svg {common}>
                    <path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.8A3.5 3.5 0 0 0 7 18z" {stroke}/>
                  </svg>
                  ''',

                  "api": f'''
                  <svg {common}>
                    <circle cx="5" cy="12" r="2" {stroke}/>
                    <circle cx="19" cy="6" r="2" {stroke}/>
                    <circle cx="19" cy="18" r="2" {stroke}/>
                    <path d="M7 11l10-4" {stroke}/>
                    <path d="M7 13l10 4" {stroke}/>
                  </svg>
                  ''',

                  "ai": f'''
                  <svg {common}>
                    <path d="M12 3l2.2 5 4.8 2-4.8 2L12 17l-2.2-5L5 10l4.8-2L12 3z" {stroke}/>
                    <path d="M18 15l.8 1.8L21 18l-2.2 1.2L18 21l-.8-1.8L15 18l2.2-1.2L18 15z" {stroke}/>
                  </svg>
                  ''',

                  "tools": f'''
                  <svg {common}>
                    <path d="M14.7 6.3a4 4 0 0 0-5 5L4 17a2 2 0 0 0 3 3l5.7-5.7a4 4 0 0 0 5-5l-2.8 2.8-3-3 2.8-2.8z" {stroke}/>
                  </svg>
                  ''',

                  "ux": f'''
                  <svg {common}>
                    <path d="M5 3l12 11-5 .8 2.8 5.2-2.8 1.4-2.7-5.2L5 20V3z" {stroke}/>
                  </svg>
                  ''',

                  "automation": f'''
                  <svg {common}>
                    <circle cx="12" cy="12" r="3" {stroke}/>
                    <path d="M12 2v3" {stroke}/>
                    <path d="M12 19v3" {stroke}/>
                    <path d="M2 12h3" {stroke}/>
                    <path d="M19 12h3" {stroke}/>
                    <path d="M4.9 4.9l2.1 2.1" {stroke}/>
                    <path d="M17 17l2.1 2.1" {stroke}/>
                    <path d="M19.1 4.9L17 7" {stroke}/>
                    <path d="M7 17l-2.1 2.1" {stroke}/>
                  </svg>
                  '''
              }

              return icons.get(kind, icons["ui"])

          def tag_kind(tag):
              mapping = {
                  "React": "react",
                  "JavaScript": "javascript",
                  "UI": "ui",
                  "Workers": "cloud",
                  "API": "api",
                  "APIs": "api",
                  "AI": "ai",
                  "Tools": "tools",
                  "UX": "ux",
                  "Automation": "automation",
              }
              return mapping.get(tag, "ui")

          def chip(x, y, tag):
              width = max(102, 54 + len(tag) * 7)
              icon_x = x + 13
              icon_y = y + 9

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{width}" height="34" rx="17"
                      fill="#151515" stroke="#3A3A3A" stroke-width="1.2"/>

                {icon(tag_kind(tag), icon_x, icon_y, 16)}

                <text x="{x + 38}" y="{y + 22}"
                      fill="#EDEDED"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="12" font-weight="700">{esc(tag)}</text>
              </g>
              ''', width

          def badge(x, y, text, mode="dark"):
              if mode == "light":
                  fill = "#EDEDED"
                  stroke = "#EDEDED"
                  color = "#050505"
              else:
                  fill = "#111111"
                  stroke = "#4A4A4A"
                  color = "#EDEDED"

              width = max(76, 28 + len(text) * 7)

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{width}" height="24" rx="12"
                      fill="{fill}" stroke="{stroke}" stroke-width="1"/>
                <text x="{x + width / 2}" y="{y + 16}" text-anchor="middle"
                      fill="{color}"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="10" font-weight="800">{esc(text)}</text>
              </g>
              ''', width

          def project_card(x, y, w, h, project):
              title = esc(project["title"])
              desc = wrap_text(project["desc"], max_chars=42, max_lines=2)

              visibility_svg, visibility_w = badge(
                  x + w - 98,
                  y + 22,
                  project["visibility"],
                  "dark"
              )

              status_svg, status_w = badge(
                  x + 24,
                  y + 58,
                  project["status"],
                  "dark"
              )

              chips_svg = ""
              cx = x + 24
              cy = y + h - 52

              for tag in project["tags"]:
                  tag_svg, tag_w = chip(cx, cy, tag)
                  chips_svg += tag_svg
                  cx += tag_w + 10

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="{h}" rx="22"
                      fill="#0F0F0F" stroke="#2B2B2B" stroke-width="1.5"/>

                <rect x="{x + 18}" y="{y + 20}" width="28" height="28" rx="9"
                      fill="#050505" stroke="#3A3A3A" stroke-width="1"/>

                {icon(project["icon"], x + 24, y + 26, 16)}

                <text x="{x + 58}" y="{y + 39}" fill="#F5F5F5"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="18" font-weight="900">{title}</text>

                {visibility_svg}
                {status_svg}

                {text_lines(x + 24, y + 108, desc)}

                {chips_svg}
              </g>
              '''

          cards = [
              project_card(36, 122, 414, 190, projects[0]),
              project_card(490, 122, 414, 190, projects[1]),
              project_card(36, 340, 414, 190, projects[2]),
              project_card(490, 340, 414, 190, projects[3]),
          ]

          svg = f'''<svg width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="{WIDTH}" height="{HEIGHT}" rx="30" fill="#050505"/>
            <rect x="1" y="1" width="{WIDTH - 2}" height="{HEIGHT - 2}" rx="29"
                  stroke="#2A2A2A" stroke-width="1.5"/>

            <rect x="36" y="34" width="8" height="50" rx="4" fill="#F5F5F5"/>

            <text x="62" y="54" fill="#F5F5F5"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="29" font-weight="900">
              Project Showcase
            </text>

            <text x="62" y="78" fill="#A8A8A8"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="14" font-weight="500">
              selected builds, tools and experiments
            </text>

            <line x1="36" y1="100" x2="904" y2="100"
                  stroke="#242424" stroke-width="2"/>

            {''.join(cards)}

            <text x="36" y="566" fill="#747474"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="12">
              last update: {now}
            </text>
          </svg>'''

          with open("assets/showcase.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit and push showcase card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/showcase.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update project showcase card"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || true

            if git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi

            echo "Push failed, retrying in 5 seconds..."
            git rebase --abort || true
            git reset --hard origin/main
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
