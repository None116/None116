name: Update Project Showcase Card

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate showcase SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import html

          now = datetime.now(ZoneInfo("Europe/Helsinki")).strftime("%d.%m.%Y • %H:%M")

          projects = [
              {
                  "title": "MRPSite",
                  "desc": "Modern web project with clean UI and polished layouts.",
                  "tags": ["React", "JavaScript", "UI"]
              },
              {
                  "title": "AI Moderation Worker",
                  "desc": "Cloudflare worker with moderation flow, filters and API fallback.",
                  "tags": ["Workers", "API", "AI"]
              },
              {
                  "title": "Window Translator",
                  "desc": "Translation and refinement utility focused on smooth UX.",
                  "tags": ["JavaScript", "Tools", "UX"]
              },
              {
                  "title": "Serverless Tools",
                  "desc": "Small useful systems, automations and experimental utilities.",
                  "tags": ["Workers", "Automation", "APIs"]
              }
          ]

          def esc(text):
              return html.escape(text)

          def chip(x, y, text, fill="#082F49", stroke="#155E75", color="#67E8F9"):
              text = esc(text)
              width = max(62, 18 + len(text) * 8)
              return f'''
              <rect x="{x}" y="{y}" rx="12" ry="12" width="{width}" height="26" fill="{fill}" stroke="{stroke}" />
              <text x="{x + width/2}" y="{y + 17}" text-anchor="middle"
                    fill="{color}" font-family="JetBrains Mono, Consolas, monospace" font-size="12">{text}</text>
              ''', width

          def project_card(x, y, w, h, title, desc, tags):
              title = esc(title)
              desc = esc(desc)

              chips_svg = ""
              cx = x + 20
              cy = y + h - 42

              for tag in tags:
                  chip_svg, chip_w = chip(cx, cy, tag)
                  chips_svg += chip_svg
                  cx += chip_w + 10

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="{h}" rx="22" fill="#0F172A" stroke="#164E63" stroke-width="1.5"/>
                <circle cx="{x + 24}" cy="{y + 24}" r="5" fill="#22D3EE"/>
                <text x="{x + 40}" y="{y + 30}" fill="#E0F2FE"
                      font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">{title}</text>

                <text x="{x + 20}" y="{y + 62}" fill="#CBD5E1"
                      font-family="JetBrains Mono, Consolas, monospace" font-size="13">{desc}</text>

                {chips_svg}
              </g>
              '''

          cards = []
          cards.append(project_card(36, 112, 392, 128, projects[0]["title"], projects[0]["desc"], projects[0]["tags"]))
          cards.append(project_card(472, 112, 392, 128, projects[1]["title"], projects[1]["desc"], projects[1]["tags"]))
          cards.append(project_card(36, 264, 392, 128, projects[2]["title"], projects[2]["desc"], projects[2]["tags"]))
          cards.append(project_card(472, 264, 392, 128, projects[3]["title"], projects[3]["desc"], projects[3]["tags"]))

          svg = f'''<svg width="900" height="450" viewBox="0 0 900 450" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="900" y2="450" gradientUnits="userSpaceOnUse">
                <stop stop-color="#020617"/>
                <stop offset="0.55" stop-color="#0F172A"/>
                <stop offset="1" stop-color="#083344"/>
              </linearGradient>

              <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#22D3EE"/>
                <stop offset="1" stop-color="#0EA5E9"/>
              </linearGradient>

              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="900" height="450" rx="28" fill="url(#bg)"/>
            <rect x="1" y="1" width="898" height="448" rx="27" stroke="#164E63" stroke-width="2"/>

            <rect x="36" y="34" width="10" height="48" rx="5" fill="url(#accent)" filter="url(#glow)"/>

            <text x="64" y="52" fill="#E0F2FE"
                  font-family="JetBrains Mono, Consolas, monospace" font-size="28" font-weight="700">
              Project Showcase
            </text>

            <text x="64" y="78" fill="#67E8F9"
                  font-family="JetBrains Mono, Consolas, monospace" font-size="14">
              selected builds, tools and experiments
            </text>

            <rect x="36" y="94" width="828" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>

            {''.join(cards)}

            <text x="36" y="424" fill="#94A3B8"
                  font-family="JetBrains Mono, Consolas, monospace" font-size="12">
              last rebuild: {now}
            </text>
          </svg>'''

          with open("assets/showcase.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit showcase card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/showcase.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update project showcase card"
            git push
          fi
