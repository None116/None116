name: Update Project Showcase Card

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-card
  cancel-in-progress: true

jobs:
  generate-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest changes
        run: |
          git pull --rebase origin main

      - name: Generate showcase SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import html

          now = datetime.now(ZoneInfo("Europe/Helsinki")).strftime("%d.%m.%Y • %H:%M")

          projects = [
              {
                  "title": "MRPSite",
                  "desc": "Modern web project with clean UI and polished layouts.",
                  "tags": ["React", "JavaScript", "UI"]
              },
              {
                  "title": "AI Moderation Worker",
                  "desc": "Cloudflare worker with moderation flow, filters and API fallback.",
                  "tags": ["Workers", "API", "AI"]
              },
              {
                  "title": "Window Translator",
                  "desc": "Translation and refinement utility focused on smooth user experience.",
                  "tags": ["JavaScript", "Tools", "UX"]
              },
              {
                  "title": "Serverless Tools",
                  "desc": "Small useful systems, automations and experimental utilities.",
                  "tags": ["Workers", "Automation", "APIs"]
              }
          ]

          WIDTH = 920
          HEIGHT = 500

          def esc(text):
              return html.escape(text)

          def wrap_text(text, max_chars=42, max_lines=2):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = word if not current else current + " " + word

                  if len(test) <= max_chars:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              if len(lines) > max_lines:
                  lines = lines[:max_lines]
                  if len(lines[-1]) > max_chars - 3:
                      lines[-1] = lines[-1][:max_chars - 3].rstrip()
                  lines[-1] += "..."

              return lines

          def render_multiline_text(x, y, lines, color="#B8C2CF", size=14, line_height=20):
              result = f'''
              <text x="{x}" y="{y}" fill="{color}"
                    font-family="Inter, Segoe UI, Arial, sans-serif"
                    font-size="{size}" font-weight="400">
              '''

              for i, line in enumerate(lines):
                  dy = 0 if i == 0 else line_height
                  result += f'<tspan x="{x}" dy="{dy}">{esc(line)}</tspan>'

              result += "</text>"
              return result

          def chip(x, y, text):
              text = esc(text)
              width = max(64, 24 + len(text) * 8)

              svg = f'''
              <rect x="{x}" y="{y}" width="{width}" height="28" rx="14"
                    fill="#0F2238" stroke="#223A57"/>
              <text x="{x + width / 2}" y="{y + 18}" text-anchor="middle"
                    fill="#8FB7E8"
                    font-family="Inter, Segoe UI, Arial, sans-serif"
                    font-size="12" font-weight="600">{text}</text>
              '''

              return svg, width

          def project_card(x, y, w, h, project):
              title = esc(project["title"])
              desc_lines = wrap_text(project["desc"], max_chars=40, max_lines=2)

              chips_svg = ""
              cx = x + 22
              cy = y + h - 46

              for tag in project["tags"]:
                  chip_svg, chip_w = chip(cx, cy, tag)
                  chips_svg += chip_svg
                  cx += chip_w + 10

              desc_svg = render_multiline_text(
                  x + 22,
                  y + 82,
                  desc_lines
              )

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="{h}" rx="20"
                      fill="#0D1522" stroke="#243447" stroke-width="1.2"/>

                <circle cx="{x + 24}" cy="{y + 28}" r="5" fill="#5FA8FF"/>

                <text x="{x + 40}" y="{y + 34}" fill="#EAF1F8"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="18" font-weight="700">{title}</text>

                {desc_svg}

                {chips_svg}
              </g>
              '''

          cards = [
              project_card(36, 116, 404, 146, projects[0]),
              project_card(480, 116, 404, 146, projects[1]),
              project_card(36, 286, 404, 146, projects[2]),
              project_card(480, 286, 404, 146, projects[3]),
          ]

          svg = f'''<svg width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="{WIDTH}" height="{HEIGHT}" rx="28" fill="#0A1018"/>
            <rect x="1" y="1" width="{WIDTH - 2}" height="{HEIGHT - 2}" rx="27"
                  stroke="#1D2A3A" stroke-width="1.5"/>

            <rect x="36" y="32" width="8" height="52" rx="4" fill="#5FA8FF"/>

            <text x="62" y="52" fill="#F2F6FA"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="28" font-weight="800">
              Project Showcase
            </text>

            <text x="62" y="76" fill="#8FA3B8"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="14" font-weight="500">
              selected builds, tools and experiments
            </text>

            <line x1="36" y1="98" x2="884" y2="98"
                  stroke="#1E3148" stroke-width="2"/>

            {''.join(cards)}

            <text x="36" y="468" fill="#7E8B99"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="12">
              last update: {now}
            </text>
          </svg>'''

          with open("assets/showcase.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit showcase card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/showcase.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update project showcase card"

          git pull --rebase origin main
          git push origin main
