name: Update Project Showcase Card

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate showcase SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import html

          now = datetime.now(ZoneInfo("Europe/Helsinki")).strftime("%d.%m.%Y • %H:%M")

          projects = [
              {
                  "title": "MRPSite",
                  "desc": "Clean web interface with polished layouts and UI logic.",
                  "visibility": "PRIVATE",
                  "status": "ACTIVE",
                  "tags": ["React", "JavaScript", "UI"]
              },
              {
                  "title": "AI Moderation Worker",
                  "desc": "Serverless moderation flow with filters and API fallback.",
                  "visibility": "PRIVATE",
                  "status": "ACTIVE",
                  "tags": ["Workers", "API", "AI"]
              },
              {
                  "title": "Window Translator",
                  "desc": "Translation utility focused on smooth user experience.",
                  "visibility": "PRIVATE",
                  "status": "EXPERIMENT",
                  "tags": ["JavaScript", "Tools", "UX"]
              },
              {
                  "title": "Serverless Tools",
                  "desc": "Small useful systems, automations and API experiments.",
                  "visibility": "PRIVATE",
                  "status": "BUILDING",
                  "tags": ["Workers", "Automation", "APIs"]
              }
          ]

          WIDTH = 940
          HEIGHT = 600

          def esc(text):
              return html.escape(text)

          def wrap_text(text, max_chars=42, max_lines=2):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  candidate = word if not current else current + " " + word
                  if len(candidate) <= max_chars:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              if len(lines) > max_lines:
                  lines = lines[:max_lines]
                  lines[-1] = lines[-1][:max_chars - 3].rstrip() + "..."

              return lines

          def text_lines(x, y, lines, size=14, color="#B8B8B8", line_height=22):
              out = f'''
              <text x="{x}" y="{y}" fill="{color}"
                    font-family="Inter, Segoe UI, Arial, sans-serif"
                    font-size="{size}" font-weight="400">
              '''
              for i, line in enumerate(lines):
                  dy = 0 if i == 0 else line_height
                  out += f'<tspan x="{x}" dy="{dy}">{esc(line)}</tspan>'
              out += '</text>'
              return out

          def tag_width(tag):
              return max(96, 54 + len(tag) * 7)

          def icon_svg(tag, x, y):
              color = "#EDEDED"

              if tag == "React":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round">
                    <ellipse cx="8" cy="8" rx="6" ry="2.8"/>
                    <ellipse cx="8" cy="8" rx="6" ry="2.8" transform="rotate(60 8 8)"/>
                    <ellipse cx="8" cy="8" rx="6" ry="2.8" transform="rotate(120 8 8)"/>
                    <circle cx="8" cy="8" r="1.5" fill="{color}" stroke="none"/>
                  </g>
                  '''

              if tag == "JavaScript":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="12" height="12" rx="2"/>
                    <path d="M6 5v4.3c0 1.4-.7 2.1-2 2.4"/>
                    <path d="M9 10.4c.5.7 1.2 1 2.1 1 1 0 1.7-.4 1.7-1.2 0-.7-.4-1-1.5-1.3l-.7-.2c-1.2-.4-1.8-1-1.8-2.1 0-1.2 1-2 2.3-2 .9 0 1.6.3 2.1 1"/>
                  </g>
                  '''

              if tag == "UI":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2">
                    <rect x="2" y="2.5" width="12" height="11" rx="1.8"/>
                    <line x1="2" y1="6.2" x2="14" y2="6.2"/>
                    <line x1="6.5" y1="6.2" x2="6.5" y2="13.5"/>
                  </g>
                  '''

              if tag == "Workers":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.2 11.5h9.3a2.8 2.8 0 0 0 0-5.6 4 4 0 0 0-7.7 1.1A2.6 2.6 0 0 0 3.2 11.5Z"/>
                    <line x1="4.8" y1="13.2" x2="11.5" y2="13.2"/>
                  </g>
                  '''

              if tag == "API" or tag == "APIs":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="3.5" cy="8" r="1.6"/>
                    <circle cx="12.5" cy="3.5" r="1.6"/>
                    <circle cx="12.5" cy="12.5" r="1.6"/>
                    <line x1="5" y1="7.3" x2="11" y2="4.2"/>
                    <line x1="5" y1="8.7" x2="11" y2="11.8"/>
                  </g>
                  '''

              if tag == "AI":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2.8 9.6 6.2 13 7.8 9.6 9.4 8 12.8 6.4 9.4 3 7.8 6.4 6.2Z"/>
                    <path d="M12.2 11.2 12.8 12.6 14.2 13.2 12.8 13.8 12.2 15.2 11.6 13.8 10.2 13.2 11.6 12.6Z"/>
                  </g>
                  '''

              if tag == "Tools":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.8 3a3 3 0 0 0-3.5 3.8L3.4 10.7a1.1 1.1 0 1 0 1.6 1.6l3.9-3.9a3 3 0 0 0 3.8-3.5l-2 2-2-2Z"/>
                  </g>
                  '''

              if tag == "UX":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l8 7-3.4.8 1.8 3.2-1.6.8-1.8-3.3L3 13.4Z"/>
                  </g>
                  '''

              if tag == "Automation":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.2" stroke-linecap="round">
                    <circle cx="8" cy="8" r="2"/>
                    <line x1="8" y1="2.2" x2="8" y2="4.2"/>
                    <line x1="8" y1="11.8" x2="8" y2="13.8"/>
                    <line x1="2.2" y1="8" x2="4.2" y2="8"/>
                    <line x1="11.8" y1="8" x2="13.8" y2="8"/>
                    <line x1="4.1" y1="4.1" x2="5.5" y2="5.5"/>
                    <line x1="10.5" y1="10.5" x2="11.9" y2="11.9"/>
                    <line x1="11.9" y1="4.1" x2="10.5" y2="5.5"/>
                    <line x1="5.5" y1="10.5" x2="4.1" y2="11.9"/>
                  </g>
                  '''

              return f'<circle cx="{x+8}" cy="{y+8}" r="5" fill="{color}"/>'

          def chip(x, y, tag):
              w = tag_width(tag)
              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="34" rx="17"
                      fill="#151515" stroke="#3A3A3A" stroke-width="1.2"/>
                <rect x="{x+9}" y="{y+8}" width="18" height="18" rx="9"
                      fill="#0B0B0B" stroke="#4A4A4A" stroke-width="1"/>
                {icon_svg(tag, x+10, y+9)}
                <text x="{x+36}" y="{y+22}"
                      fill="#EDEDED"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="12" font-weight="600">{esc(tag)}</text>
              </g>
              ''', w

          def status_badge(x, y, text):
              if text == "PRIVATE":
                  fill = "#111111"
                  stroke = "#5A5A5A"
                  color = "#EDEDED"
              else:
                  fill = "#EDEDED"
                  stroke = "#EDEDED"
                  color = "#050505"

              w = 76
              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="24" rx="12"
                      fill="{fill}" stroke="{stroke}" stroke-width="1"/>
                <text x="{x + w/2}" y="{y + 16}" text-anchor="middle"
                      fill="{color}"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="10" font-weight="800">{esc(text)}</text>
              </g>
              '''

          def status_text_badge(x, y, text):
              w = max(68, 24 + len(text) * 7)
              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="24" rx="12"
                      fill="#0D0D0D" stroke="#333333" stroke-width="1"/>
                <text x="{x + w/2}" y="{y + 16}" text-anchor="middle"
                      fill="#AFAFAF"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="10" font-weight="700">{esc(text)}</text>
              </g>
              ''', w

          def project_icon(title, x, y):
              color = "#EDEDED"

              if title == "MRPSite":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.4">
                    <rect x="2" y="3" width="14" height="10" rx="1.5"/>
                    <line x1="7" y1="15" x2="11" y2="15"/>
                    <line x1="9" y1="13" x2="9" y2="15"/>
                  </g>
                  '''

              if title == "AI Moderation Worker":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.4" stroke-linejoin="round">
                    <path d="M9 2.5 15 5v4.6c0 3.4-2.7 5.5-6 6.8-3.3-1.3-6-3.4-6-6.8V5Z"/>
                    <path d="M6.2 9.2 8.3 11.3 12.2 7.2"/>
                  </g>
                  '''

              if title == "Window Translator":
                  return f'''
                  <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.3" stroke-linecap="round">
                    <line x1="3" y1="4" x2="10" y2="4"/>
                    <line x1="6.5" y1="4" x2="6.5" y2="14"/>
                    <path d="M10 4c-.8 4.6-2.6 7.5-6.5 10"/>
                    <path d="M12" y="6"/>
                    <line x1="12.5" y1="5" x2="16" y2="5"/>
                    <line x1="14.2" y1="5" x2="14.2" y2="14"/>
                    <line x1="12.5" y1="14" x2="16" y2="14"/>
                  </g>
                  '''

              return f'''
              <g transform="translate({x},{y})" fill="none" stroke="{color}" stroke-width="1.4">
                <rect x="3" y="8" width="12" height="5" rx="1.2"/>
                <line x1="6" y1="4" x2="6" y2="8"/>
                <line x1="12" y1="4" x2="12" y2="8"/>
                <line x1="5" y1="13" x2="5" y2="16"/>
                <line x1="13" y1="13" x2="13" y2="16"/>
              </g>
              '''

          def project_card(x, y, w, h, project):
              title = esc(project["title"])
              desc = wrap_text(project["desc"], max_chars=42, max_lines=2)

              chips_svg = ""
              cx = x + 24
              cy = y + h - 52

              for tag in project["tags"]:
                  tag_svg, tag_w = chip(cx, cy, tag)
                  chips_svg += tag_svg
                  cx += tag_w + 10

              small_status, small_w = status_text_badge(x + 24, y + 52, project["status"])

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="{h}" rx="22"
                      fill="#0F0F0F" stroke="#2B2B2B" stroke-width="1.5"/>

                <rect x="{x+18}" y="{y+20}" width="26" height="26" rx="8"
                      fill="#050505" stroke="#3A3A3A" stroke-width="1"/>
                {project_icon(project["title"], x+22, y+24)}

                <text x="{x+56}" y="{y+38}" fill="#F5F5F5"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="18" font-weight="800">{title}</text>

                {status_badge(x + w - 98, y + 22, project["visibility"])}

                {small_status}

                {text_lines(x + 24, y + 98, desc)}

                {chips_svg}
              </g>
              '''

          cards = [
              project_card(36, 122, 414, 190, projects[0]),
              project_card(490, 122, 414, 190, projects[1]),
              project_card(36, 340, 414, 190, projects[2]),
              project_card(490, 340, 414, 190, projects[3]),
          ]

          svg = f'''<svg width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="{WIDTH}" height="{HEIGHT}" rx="30" fill="#050505"/>
            <rect x="1" y="1" width="{WIDTH-2}" height="{HEIGHT-2}" rx="29"
                  stroke="#2A2A2A" stroke-width="1.5"/>

            <rect x="36" y="34" width="8" height="50" rx="4" fill="#F5F5F5"/>

            <text x="62" y="54" fill="#F5F5F5"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="29" font-weight="900">
              Project Showcase
            </text>

            <text x="62" y="78" fill="#A8A8A8"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="14" font-weight="500">
              selected builds, tools and experiments
            </text>

            <line x1="36" y1="100" x2="904" y2="100"
                  stroke="#242424" stroke-width="2"/>

            {''.join(cards)}

            <text x="36" y="566" fill="#747474"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="12">
              last update: {now}
            </text>
          </svg>'''

          with open("assets/showcase.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit and push showcase card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/showcase.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update project showcase card"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || true

            if git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi

            echo "Push failed, retrying in 5 seconds..."
            git rebase --abort || true
            git reset --hard origin/main
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
