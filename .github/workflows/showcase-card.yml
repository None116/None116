name: Update Project Showcase Card

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate showcase SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import html

          now = datetime.now(ZoneInfo("Europe/Helsinki")).strftime("%d.%m.%Y • %H:%M")

          projects = [
              {
                  "title": "MRPSite",
                  "desc": "Clean web interface with polished layouts and UI logic.",
                  "tags": ["React", "JavaScript", "UI"]
              },
              {
                  "title": "AI Moderation Worker",
                  "desc": "Serverless moderation flow with filters and API fallback.",
                  "tags": ["Workers", "API", "AI"]
              },
              {
                  "title": "Window Translator",
                  "desc": "Translation utility focused on smooth user experience.",
                  "tags": ["JavaScript", "Tools", "UX"]
              },
              {
                  "title": "Serverless Tools",
                  "desc": "Small useful systems, automations and API experiments.",
                  "tags": ["Workers", "Automation", "APIs"]
              }
          ]

          WIDTH = 920
          HEIGHT = 570

          def esc(text):
              return html.escape(text)

          def wrap_text(text, max_chars=38, max_lines=2):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = word if not current else current + " " + word

                  if len(test) <= max_chars:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              if len(lines) > max_lines:
                  lines = lines[:max_lines]
                  if len(lines[-1]) > max_chars - 3:
                      lines[-1] = lines[-1][:max_chars - 3].rstrip()
                  lines[-1] += "..."

              return lines

          def render_multiline_text(x, y, lines):
              result = f'''
              <text x="{x}" y="{y}" fill="#B8C2CF"
                    font-family="Inter, Segoe UI, Arial, sans-serif"
                    font-size="14" font-weight="400">
              '''

              for i, line in enumerate(lines):
                  dy = 0 if i == 0 else 22
                  result += f'<tspan x="{x}" dy="{dy}">{esc(line)}</tspan>'

              result += "</text>"
              return result

          def tag_style(text):
              styles = {
                  "React": {
                      "icon": "R",
                      "chip_fill": "#0F2238",
                      "chip_stroke": "#223A57",
                      "icon_fill": "#14304B",
                      "icon_stroke": "#27557A",
                      "icon_text": "#7DD3FC",
                      "text_color": "#C7D8EA"
                  },
                  "JavaScript": {
                      "icon": "JS",
                      "chip_fill": "#201A08",
                      "chip_stroke": "#4D4120",
                      "icon_fill": "#3C320B",
                      "icon_stroke": "#6B5A18",
                      "icon_text": "#FDE68A",
                      "text_color": "#E7DDAC"
                  },
                  "UI": {
                      "icon": "UI",
                      "chip_fill": "#132233",
                      "chip_stroke": "#29435F",
                      "icon_fill": "#1B2F47",
                      "icon_stroke": "#345474",
                      "icon_text": "#93C5FD",
                      "text_color": "#C9D8E8"
                  },
                  "Workers": {
                      "icon": "W",
                      "chip_fill": "#23170F",
                      "chip_stroke": "#4A3324",
                      "icon_fill": "#3A2417",
                      "icon_stroke": "#6B4128",
                      "icon_text": "#FDBA74",
                      "text_color": "#E6CFBD"
                  },
                  "API": {
                      "icon": "{}",
                      "chip_fill": "#122232",
                      "chip_stroke": "#27445F",
                      "icon_fill": "#1A3249",
                      "icon_stroke": "#345A7C",
                      "icon_text": "#93C5FD",
                      "text_color": "#C8D8E8"
                  },
                  "APIs": {
                      "icon": "{}",
                      "chip_fill": "#122232",
                      "chip_stroke": "#27445F",
                      "icon_fill": "#1A3249",
                      "icon_stroke": "#345A7C",
                      "icon_text": "#93C5FD",
                      "text_color": "#C8D8E8"
                  },
                  "AI": {
                      "icon": "AI",
                      "chip_fill": "#241529",
                      "chip_stroke": "#4A2A55",
                      "icon_fill": "#352042",
                      "icon_stroke": "#6B3E7E",
                      "icon_text": "#E9D5FF",
                      "text_color": "#E5D5EF"
                  },
                  "Tools": {
                      "icon": "T",
                      "chip_fill": "#18211D",
                      "chip_stroke": "#33493D",
                      "icon_fill": "#223228",
                      "icon_stroke": "#456152",
                      "icon_text": "#BBF7D0",
                      "text_color": "#D5E7DB"
                  },
                  "UX": {
                      "icon": "UX",
                      "chip_fill": "#1F1722",
                      "chip_stroke": "#47314B",
                      "icon_fill": "#312337",
                      "icon_stroke": "#62486A",
                      "icon_text": "#F5D0FE",
                      "text_color": "#E6D6EA"
                  },
                  "Automation": {
                      "icon": "A",
                      "chip_fill": "#172118",
                      "chip_stroke": "#334737",
                      "icon_fill": "#233126",
                      "icon_stroke": "#4A6450",
                      "icon_text": "#BBF7D0",
                      "text_color": "#D6E7DA"
                  }
              }

              return styles.get(text, {
                  "icon": text[:1].upper(),
                  "chip_fill": "#0F2238",
                  "chip_stroke": "#223A57",
                  "icon_fill": "#18324B",
                  "icon_stroke": "#2D4C6D",
                  "icon_text": "#8FB7E8",
                  "text_color": "#C9D7E6"
              })

          def chip(x, y, text):
              style = tag_style(text)
              label = esc(text)
              icon = esc(style["icon"])

              width = max(88, 52 + len(text) * 8)

              svg = f'''
              <g>
                <rect x="{x}" y="{y}" width="{width}" height="30" rx="15"
                      fill="{style["chip_fill"]}" stroke="{style["chip_stroke"]}" stroke-width="1"/>

                <rect x="{x + 8}" y="{y + 6}" width="18" height="18" rx="9"
                      fill="{style["icon_fill"]}" stroke="{style["icon_stroke"]}" stroke-width="1"/>

                <text x="{x + 17}" y="{y + 18.5}" text-anchor="middle"
                      fill="{style["icon_text"]}"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="9" font-weight="800">{icon}</text>

                <text x="{x + 34}" y="{y + 20}"
                      fill="{style["text_color"]}"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="12" font-weight="600">{label}</text>
              </g>
              '''

              return svg, width

          def project_card(x, y, w, h, project):
              title = esc(project["title"])
              desc_lines = wrap_text(project["desc"])

              chips_svg = ""
              cx = x + 24
              cy = y + h - 50

              for tag in project["tags"]:
                  chip_svg, chip_w = chip(cx, cy, tag)
                  chips_svg += chip_svg
                  cx += chip_w + 10

              desc_svg = render_multiline_text(
                  x + 24,
                  y + 86,
                  desc_lines
              )

              return f'''
              <g>
                <rect x="{x}" y="{y}" width="{w}" height="{h}" rx="22"
                      fill="#0D1522" stroke="#243447" stroke-width="1.2"/>

                <circle cx="{x + 26}" cy="{y + 30}" r="5" fill="#5FA8FF"/>

                <text x="{x + 44}" y="{y + 36}" fill="#EAF1F8"
                      font-family="Inter, Segoe UI, Arial, sans-serif"
                      font-size="18" font-weight="800">{title}</text>

                {desc_svg}

                {chips_svg}
              </g>
              '''

          cards = [
              project_card(36, 124, 404, 172, projects[0]),
              project_card(480, 124, 404, 172, projects[1]),
              project_card(36, 322, 404, 172, projects[2]),
              project_card(480, 322, 404, 172, projects[3]),
          ]

          svg = f'''<svg width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="{WIDTH}" height="{HEIGHT}" rx="28" fill="#0A1018"/>
            <rect x="1" y="1" width="{WIDTH - 2}" height="{HEIGHT - 2}" rx="27"
                  stroke="#1D2A3A" stroke-width="1.5"/>

            <rect x="36" y="32" width="8" height="52" rx="4" fill="#5FA8FF"/>

            <text x="62" y="52" fill="#F2F6FA"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="28" font-weight="800">
              Project Showcase
            </text>

            <text x="62" y="76" fill="#8FA3B8"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="14" font-weight="500">
              selected builds, tools and experiments
            </text>

            <line x1="36" y1="100" x2="884" y2="100"
                  stroke="#1E3148" stroke-width="2"/>

            {''.join(cards)}

            <text x="36" y="536" fill="#7E8B99"
                  font-family="Inter, Segoe UI, Arial, sans-serif"
                  font-size="12">
              last update: {now}
            </text>
          </svg>'''

          with open("assets/showcase.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit and push showcase card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/showcase.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update project showcase card"

          git pull --rebase origin main
          git push origin HEAD:main
