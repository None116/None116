  <text x="34" y="180">
    <tspan class="line cmd" style="animation-delay:0.0s" x="34" dy="0">OS: Arch Linux x86_64</tspan><tspan class="line cmd" style="animation-delay:0.1s" x="34" dy="22">User: Semoof / None116</tspan><tspan class="line out" style="animation-delay:0.2s" x="34" dy="22">Shell: zsh</tspan><tspan class="line out" style="animation-delay:0.4s" x="34" dy="22">Stack: JavaScript, React, Workers, APIs</tspan><tspan class="line out" style="animation-delay:0.5s" x="34" dy="22">Mode: private repos, public grind</tspan><tspan class="line out" style="animation-delay:0.6s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:0.7s" x="34" dy="22">$ pwd</tspan><tspan class="line out" style="animation-delay:0.8s" x="34" dy="22">/home/semoof/projects</tspan><tspan class="line out" style="animation-delay:1.0s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:1.1s" x="34" dy="22">$ ls</tspan><tspan class="line out" style="animation-delay:1.2s" x="34" dy="22">MRPSite/  ai-moderation-worker/  translator/  tools/</tspan><tspan class="line out" style="animation-delay:1.3s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:1.4s" x="34" dy="22">$ git status</tspan><tspan class="line out" style="animation-delay:1.6s" x="34" dy="22">On branch main</tspan><tspan class="line out" style="animation-delay:1.7s" x="34" dy="22">working tree clean</tspan><tspan class="line out" style="animation-delay:1.8s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:1.9s" x="34" dy="22">$ npm install</tspan><tspan class="line out" style="animation-delay:2.0s" x="34" dy="22">packages checked</tspan><tspan class="line out" style="animation-delay:2.2s" x="34" dy="22">dependencies ready</tspan><tspan class="line out" style="animation-delay:2.3s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:2.4s" x="34" dy="22">$ npm run dev</tspan><tspan class="line out" style="animation-delay:2.5s" x="34" dy="22">local server started</tspan><tspan class="line out" style="animation-delay:2.6s" x="34" dy="22">listening on localhost:5173</tspan><tspan class="line out" style="animation-delay:2.8s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:2.9s" x="34" dy="22">$ curl /api/health</tspan><tspan class="line out" style="animation-delay:3.0s" x="34" dy="22">{ &quot;status&quot;: &quot;ok&quot;, &quot;runtime&quot;: &quot;worker&quot;, &quot;cache&quot;: &quot;warm&quot; }</tspan><tspan class="line out" style="animation-delay:3.1s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:3.2s" x="34" dy="22">$ node worker.js --dry-run</tspan><tspan class="line out" style="animation-delay:3.4s" x="34" dy="22">loading moderation pipeline</tspan><tspan class="line out" style="animation-delay:3.5s" x="34" dy="22">local filter ready</tspan><tspan class="line out" style="animation-delay:3.6s" x="34" dy="22">api fallback ready</tspan><tspan class="line out" style="animation-delay:3.7s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:3.8s" x="34" dy="22">$ npm run lint</tspan><tspan class="line out" style="animation-delay:4.0s" x="34" dy="22">0 errors found</tspan><tspan class="line out" style="animation-delay:4.1s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:4.2s" x="34" dy="22">$ npm run build</tspan><tspan class="line out" style="animation-delay:4.3s" x="34" dy="22">bundling assets</tspan><tspan class="line out" style="animation-delay:4.4s" x="34" dy="22">optimizing chunks</tspan><tspan class="line out" style="animation-delay:4.6s" x="34" dy="22">build complete</tspan><tspan class="line out" style="animation-delay:4.7s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:4.8s" x="34" dy="22">$ wrangler deploy</tspan><tspan class="line out" style="animation-delay:4.9s" x="34" dy="22">uploading worker</tspan><tspan class="line out" style="animation-delay:5.0s" x="34" dy="22">routes checked</tspan><tspan class="line out" style="animation-delay:5.2s" x="34" dy="22">deployment successful</tspan><tspan class="line out" style="animation-delay:5.3s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:5.4s" x="34" dy="22">$ git add .</tspan><tspan class="line out" style="animation-delay:5.5s" x="34" dy="22">staged changes</tspan><tspan class="line out" style="animation-delay:5.6s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:5.8s" x="34" dy="22">$ git commit -m &quot;ship clean update&quot;</tspan><tspan class="line out" style="animation-delay:5.9s" x="34" dy="22">7 files changed</tspan><tspan class="line out" style="animation-delay:6.0s" x="34" dy="22">commit created</tspan><tspan class="line out" style="animation-delay:6.1s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:6.2s" x="34" dy="22">$ git push</tspan><tspan class="line out" style="animation-delay:6.4s" x="34" dy="22">enumerating objects</tspan><tspan class="line out" style="animation-delay:6.5s" x="34" dy="22">compressing objects</tspan><tspan class="line out" style="animation-delay:6.6s" x="34" dy="22">private repos updated</tspan><tspan class="line out" style="animation-delay:6.7s" x="34" dy="22">public grind visible</tspan><tspan class="line out" style="animation-delay:6.8s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:7.0s" x="34" dy="22">$ npm run preview</tspan><tspan class="line out" style="animation-delay:7.1s" x="34" dy="22">preview server online</tspan><tspan class="line out" style="animation-delay:7.2s" x="34" dy="22"></tspan><tspan class="line cmd" style="animation-delay:7.3s" x="34" dy="22">$ echo done</tspan><tspan class="line out" style="animation-delay:7.4s" x="34" dy="22">done <tspan class="cursor">█</tspan></tspan>
  </text>
