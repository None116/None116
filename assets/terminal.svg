  <text x="34" y="76">
    <tspan class="line cmd" style="animation-delay:0.00s" x="34" dy="0">semoof@arch ~ % fastfetch</tspan><tspan class="line out" style="animation-delay:0.10s" x="34" dy="22">OS: Arch Linux x86_64</tspan><tspan class="line out" style="animation-delay:0.20s" x="34" dy="22">Kernel: caffeine-powered</tspan><tspan class="line out" style="animation-delay:0.30s" x="34" dy="22">Shell: zsh</tspan><tspan class="line out" style="animation-delay:0.40s" x="34" dy="22">Editor: VS Code / Vim when brave</tspan><tspan class="line out" style="animation-delay:0.50s" x="34" dy="22">Stack: JavaScript, React, Workers, APIs</tspan><tspan class="line out" style="animation-delay:0.60s" x="34" dy="22">Uptime: building quietly</tspan><tspan class="line out" style="animation-delay:0.70s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:0.80s" x="34" dy="22">$ pwd</tspan><tspan class="line out" style="animation-delay:0.90s" x="34" dy="22">/home/semoof/projects</tspan><tspan class="line out" style="animation-delay:1.00s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:1.10s" x="34" dy="22">$ ls -la</tspan><tspan class="line out" style="animation-delay:1.20s" x="34" dy="22">drwxr-xr-x  MRPSite/</tspan><tspan class="line out" style="animation-delay:1.30s" x="34" dy="22">drwxr-xr-x  ai-moderation-worker/</tspan><tspan class="line out" style="animation-delay:1.40s" x="34" dy="22">drwxr-xr-x  window-translator/</tspan><tspan class="line out" style="animation-delay:1.50s" x="34" dy="22">drwxr-xr-x  serverless-tools/</tspan><tspan class="line out" style="animation-delay:1.60s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:1.70s" x="34" dy="22">$ git status</tspan><tspan class="line out" style="animation-delay:1.80s" x="34" dy="22">On branch main</tspan><tspan class="line ok" style="animation-delay:1.90s" x="34" dy="22">working tree clean</tspan><tspan class="line out" style="animation-delay:2.00s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:2.10s" x="34" dy="22">$ git log --oneline -5</tspan><tspan class="line out" style="animation-delay:2.20s" x="34" dy="22">a91c0de update project showcase</tspan><tspan class="line out" style="animation-delay:2.30s" x="34" dy="22">b16f00d improve worker fallback</tspan><tspan class="line out" style="animation-delay:2.40s" x="34" dy="22">c0ffee fix UI spacing</tspan><tspan class="line out" style="animation-delay:2.50s" x="34" dy="22">badc0de remove cringe</tspan><tspan class="line out" style="animation-delay:2.60s" x="34" dy="22">1337abc ship quiet build</tspan><tspan class="line out" style="animation-delay:2.70s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:2.80s" x="34" dy="22">$ npm install</tspan><tspan class="line out" style="animation-delay:2.90s" x="34" dy="22">packages checked</tspan><tspan class="line ok" style="animation-delay:3.00s" x="34" dy="22">dependencies ready</tspan><tspan class="line out" style="animation-delay:3.10s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:3.20s" x="34" dy="22">$ npm run dev</tspan><tspan class="line out" style="animation-delay:3.30s" x="34" dy="22">local server started</tspan><tspan class="line out" style="animation-delay:3.40s" x="34" dy="22">listening on localhost:5173</tspan><tspan class="line out" style="animation-delay:3.50s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:3.60s" x="34" dy="22">$ curl /api/health</tspan><tspan class="line out" style="animation-delay:3.70s" x="34" dy="22">{ &quot;status&quot;: &quot;ok&quot;, &quot;runtime&quot;: &quot;worker&quot;, &quot;cache&quot;: &quot;warm&quot; }</tspan><tspan class="line out" style="animation-delay:3.80s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:3.90s" x="34" dy="22">$ node worker.js --dry-run</tspan><tspan class="line out" style="animation-delay:4.00s" x="34" dy="22">loading moderation pipeline</tspan><tspan class="line ok" style="animation-delay:4.10s" x="34" dy="22">local filter ready</tspan><tspan class="line ok" style="animation-delay:4.20s" x="34" dy="22">cloudflare ai ready</tspan><tspan class="line ok" style="animation-delay:4.30s" x="34" dy="22">groq fallback ready</tspan><tspan class="line out" style="animation-delay:4.40s" x="34" dy="22">decision: allow</tspan><tspan class="line out" style="animation-delay:4.50s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:4.60s" x="34" dy="22">$ grep -R &quot;TODO&quot; src/</tspan><tspan class="line ok" style="animation-delay:4.70s" x="34" dy="22">src/ui/polish.js: TODO: make it cleaner</tspan><tspan class="line warn" style="animation-delay:4.80s" x="34" dy="22">src/api/fallback.js: TODO: handle timeout</tspan><tspan class="line out" style="animation-delay:4.90s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:5.00s" x="34" dy="22">$ vim src/api/fallback.js</tspan><tspan class="line out" style="animation-delay:5.10s" x="34" dy="22">:wq</tspan><tspan class="line out" style="animation-delay:5.20s" x="34" dy="22">patched timeout handler</tspan><tspan class="line out" style="animation-delay:5.30s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:5.40s" x="34" dy="22">$ npm run lint</tspan><tspan class="line out" style="animation-delay:5.50s" x="34" dy="22">0 errors found</tspan><tspan class="line out" style="animation-delay:5.60s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:5.70s" x="34" dy="22">$ npm run test</tspan><tspan class="line ok" style="animation-delay:5.80s" x="34" dy="22">moderation.test.js passed</tspan><tspan class="line ok" style="animation-delay:5.90s" x="34" dy="22">api-fallback.test.js passed</tspan><tspan class="line ok" style="animation-delay:6.00s" x="34" dy="22">ui-spacing.test.js passed</tspan><tspan class="line out" style="animation-delay:6.10s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:6.20s" x="34" dy="22">$ npm run build</tspan><tspan class="line out" style="animation-delay:6.30s" x="34" dy="22">bundling assets</tspan><tspan class="line out" style="animation-delay:6.40s" x="34" dy="22">optimizing chunks</tspan><tspan class="line out" style="animation-delay:6.50s" x="34" dy="22">minifying modules</tspan><tspan class="line out" style="animation-delay:6.60s" x="34" dy="22">build complete</tspan><tspan class="line out" style="animation-delay:6.70s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:6.80s" x="34" dy="22">$ du -sh dist</tspan><tspan class="line out" style="animation-delay:6.90s" x="34" dy="22">428K dist</tspan><tspan class="line out" style="animation-delay:7.00s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:7.10s" x="34" dy="22">$ wrangler deploy</tspan><tspan class="line out" style="animation-delay:7.20s" x="34" dy="22">uploading worker</tspan><tspan class="line out" style="animation-delay:7.30s" x="34" dy="22">checking routes</tspan><tspan class="line out" style="animation-delay:7.40s" x="34" dy="22">publishing version</tspan><tspan class="line ok" style="animation-delay:7.50s" x="34" dy="22">deployment successful</tspan><tspan class="line out" style="animation-delay:7.60s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:7.70s" x="34" dy="22">$ curl /api/moderate -X POST</tspan><tspan class="line out" style="animation-delay:7.80s" x="34" dy="22">{ &quot;safe&quot;: true, &quot;source&quot;: &quot;local+fallback&quot; }</tspan><tspan class="line out" style="animation-delay:7.90s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:8.00s" x="34" dy="22">$ git diff --stat</tspan><tspan class="line out" style="animation-delay:8.10s" x="34" dy="22">README.md                  | 42 +++++++++++++</tspan><tspan class="line out" style="animation-delay:8.20s" x="34" dy="22">assets/showcase.svg        | 91 +++++++++++++++++++++++++</tspan><tspan class="line out" style="animation-delay:8.30s" x="34" dy="22">worker.js                  | 18 ++++++</tspan><tspan class="line out" style="animation-delay:8.40s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:8.50s" x="34" dy="22">$ git add .</tspan><tspan class="line out" style="animation-delay:8.60s" x="34" dy="22">staged changes</tspan><tspan class="line out" style="animation-delay:8.70s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:8.80s" x="34" dy="22">$ git commit -m &quot;clean profile update&quot;</tspan><tspan class="line out" style="animation-delay:8.90s" x="34" dy="22">3 files changed</tspan><tspan class="line out" style="animation-delay:9.00s" x="34" dy="22">commit created</tspan><tspan class="line out" style="animation-delay:9.10s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:9.20s" x="34" dy="22">$ git push</tspan><tspan class="line out" style="animation-delay:9.30s" x="34" dy="22">enumerating objects</tspan><tspan class="line out" style="animation-delay:9.40s" x="34" dy="22">compressing objects</tspan><tspan class="line out" style="animation-delay:9.50s" x="34" dy="22">writing objects</tspan><tspan class="line out" style="animation-delay:9.60s" x="34" dy="22">private repos updated</tspan><tspan class="line out" style="animation-delay:9.70s" x="34" dy="22">public grind visible</tspan><tspan class="line out" style="animation-delay:9.80s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:9.90s" x="34" dy="22">$ sudo pacman -Syu</tspan><tspan class="line out" style="animation-delay:10.00s" x="34" dy="22">:: synchronizing package databases...</tspan><tspan class="line ok" style="animation-delay:10.10s" x="34" dy="22">:: system is already up to date</tspan><tspan class="line out" style="animation-delay:10.20s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:10.30s" x="34" dy="22">$ echo &quot;never push secrets&quot;</tspan><tspan class="line out" style="animation-delay:10.40s" x="34" dy="22">never push secrets</tspan><tspan class="line out" style="animation-delay:10.50s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:10.60s" x="34" dy="22">$ cat .gitignore</tspan><tspan class="line out" style="animation-delay:10.70s" x="34" dy="22">.env</tspan><tspan class="line out" style="animation-delay:10.80s" x="34" dy="22">.env.local</tspan><tspan class="line out" style="animation-delay:10.90s" x="34" dy="22">node_modules/</tspan><tspan class="line out" style="animation-delay:11.00s" x="34" dy="22">dist/</tspan><tspan class="line out" style="animation-delay:11.10s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:11.20s" x="34" dy="22">$ rm -rf cringe</tspan><tspan class="line out" style="animation-delay:11.30s" x="34" dy="22">removed: cringe/</tspan><tspan class="line out" style="animation-delay:11.40s" x="34" dy="22"> </tspan><tspan class="line cmd" style="animation-delay:11.50s" x="34" dy="22">$ echo done</tspan><tspan class="line out" style="animation-delay:11.60s" x="34" dy="22">done <tspan class="cursor">█</tspan></tspan>
